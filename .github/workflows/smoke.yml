name: Android launch check

# Builds the release APK of a dev branch (same R8 shrinking as a real release, plus the
# emulator's x86_64), opens it on an emulator and reports whether the app starts or crashes:
# the crash from logcat as annotations, a screenshot as an artifact. A dev branch should pass
# this before it is merged — 0.7.0 shipped a release that closed at launch (R8 + WorkManager).
# Dispatch with a tag to open a published APK instead.
on:
  push:
    branches: ["dev/**"]
    paths:
      - "app/**"
      - ".github/workflows/smoke.yml"
      - "scripts/ci-android-smoke.sh"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag whose APK to open instead of building the branch
        required: false

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  launch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Download the APK
        if: inputs.tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "${{ inputs.tag }}" --pattern '*.apk' --output app.apk --repo "${{ github.repository }}"
      - uses: actions/setup-node@v5
        if: ${{ !inputs.tag }}
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v5
        if: ${{ !inputs.tag }}
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
        if: ${{ !inputs.tag }}
      - name: Build the release APK (x86_64 for the emulator)
        if: ${{ !inputs.tag }}
        working-directory: app
        env:
          CI: 1
        run: |
          set -o pipefail
          npm ci
          npx expo prebuild --platform android --no-install --clean
          cd android
          if ! ./gradlew assembleRelease --console=plain -PreactNativeArchitectures=x86_64 2>&1 | tee build.log; then
            grep -E '^e: |error:|ERROR:|What went wrong|FAILED' -A3 build.log | head -40 | while IFS= read -r line; do echo "::error::${line}"; done
            exit 1
          fi
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/app.apk"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Open the app on an emulator
        id: emulator
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-boot-timeout: 1200
          script: bash scripts/ci-android-smoke.sh app.apk
      # The emulator sometimes fails to boot on GitHub runners: one more try.
      - name: Open the app on an emulator (retry)
        id: emulator2
        if: steps.emulator.outcome == 'failure' && hashFiles('smoke.log') == ''
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-boot-timeout: 1200
          script: bash scripts/ci-android-smoke.sh app.apk
      - name: Report
        if: always()
        run: |
          [ -f smoke.log ] || { echo "::error::the emulator never booted — no answer, run again"; exit 1; }
          head -3 smoke.log | while IFS= read -r l; do echo "::notice::$l"; done
          # One annotation per chunk: GitHub keeps 10 per step and ~6000 characters each.
          if grep -q 'FATAL EXCEPTION' smoke.log; then
            sed -n '/== crash buffer/,/== errors/p' smoke.log | grep -v '^\s*at com.facebook\|^\s*at android.os' | head -80 | tr '\n' '|' | cut -c1-6000 | sed 's/^/::error::crash: /'
          fi
          sed -n '/== errors/,$p' smoke.log | tail -40 | tr '\n' '|' | cut -c1-6000 | sed 's/^/::warning::errors: /'
          echo
          if grep -q '^== alive' smoke.log && ! grep -q 'FATAL EXCEPTION' smoke.log; then
            echo "::notice::the app started and was still running after 30 s"
          else
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke
          path: |
            smoke.log
            smoke.png
