name: Native audio

# Tests the on-device audio module (app/modules/shiron-audio):
#  • apple: the Swift core on macOS (same AVFoundation/AudioToolbox as iOS) against every fixture;
#    per-format results appear as annotations.
#  • android: compiles the Kotlin module and runs the LoudnessPlan unit tests. The instrumented
#    tests (src/androidTest, real MediaCodec on the fixtures) need an emulator, which didn't start
#    on GitHub runners in Oct 2026 — run them locally: ./gradlew :shiron-audio:connectedDebugAndroidTest
on:
  push:
    branches: [main, "dev/**"]
    paths:
      - "app/modules/**"
      - ".github/workflows/native.yml"
  pull_request:
    paths:
      - "app/modules/**"
  workflow_dispatch:

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apple:
    # macOS has the same AVFoundation / AudioToolbox as iOS; runs the Swift core without Expo.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      # Own step: GitHub keeps only 10 notices per step.
      - name: Decoder diagnostics
        continue-on-error: true
        run: bash app/modules/shiron-audio/swift-tests/run.sh --filter DiagnosticsTests 2>&1 | grep -E '::notice::|error' | head -20
      - name: Swift tests
        run: |
          set -o pipefail
          if ! bash app/modules/shiron-audio/swift-tests/run.sh 2>&1 | tee swift.log; then
            grep -E 'error:|failed|XCTAssert' swift.log | head -40 | while IFS= read -r line; do echo "::error::${line}"; done
            exit 1
          fi

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      - name: Install dependencies
        working-directory: app
        run: npm ci
      - name: Generate Android project
        working-directory: app
        run: npx expo prebuild --platform android --no-install --clean
        env:
          CI: 1
      - name: Unit tests (loudness plan)
        working-directory: app/android
        run: |
          set -o pipefail
          if ! ./gradlew :shiron-audio:testDebugUnitTest --console=plain --stacktrace 2>&1 | tee unit.log; then
            # One annotation (GitHub keeps 10 per step): the reason Gradle gives, joined.
            echo "::error::$(grep -E '^e: |error:|FAILED|What went wrong|Caused by|Test.*>' -A4 unit.log | grep -v '^\s*at ' | head -60 | tr '\n' '|' | cut -c1-6000)"
            exit 1
          fi
