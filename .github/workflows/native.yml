name: Native audio

# Tests the on-device audio module (app/modules/shiron-audio):
#  • apple: the Swift core on macOS (same AVFoundation/AudioToolbox as iOS) against every fixture;
#    per-format results appear as annotations.
#  • android: compiles the Kotlin module and runs the LoudnessPlan unit tests, then tries the
#    instrumented tests (src/androidTest, real MediaCodec on the fixtures) on an emulator. The
#    emulator has been unreliable on GitHub runners, so that step doesn't fail the job; its
#    results appear as annotations.
on:
  push:
    branches: [main, "dev/**"]
    paths:
      - "app/modules/**"
      - ".github/workflows/native.yml"
  pull_request:
    paths:
      - "app/modules/**"
  workflow_dispatch:

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apple:
    # macOS has the same AVFoundation / AudioToolbox as iOS; runs the Swift core without Expo.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      # Own step: GitHub keeps only 10 notices per step.
      - name: Decoder diagnostics
        continue-on-error: true
        run: bash app/modules/shiron-audio/swift-tests/run.sh --filter DiagnosticsTests 2>&1 | grep -E '::notice::|error' | head -20
      - name: Swift tests
        run: |
          set -o pipefail
          if ! bash app/modules/shiron-audio/swift-tests/run.sh 2>&1 | tee swift.log; then
            grep -E 'error:|failed|XCTAssert' swift.log | head -40 | while IFS= read -r line; do echo "::error::${line}"; done
            exit 1
          fi

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: Install dependencies
        working-directory: app
        run: npm ci
      - name: Cache the FFmpeg build
        uses: actions/cache@v6
        with:
          path: build/ffmpeg
          key: ffmpeg-android-x86_64-${{ hashFiles('scripts/build-ffmpeg.sh', 'app/modules/shiron-audio/native/ffmpeg/*') }}
      - name: Build FFmpeg for what the phone can't read (LGPL)
        run: scripts/build-ffmpeg.sh android x86_64
      - name: Generate Android project
        working-directory: app
        run: npx expo prebuild --platform android --no-install --clean
        env:
          CI: 1
      - name: Unit tests (loudness plan)
        working-directory: app/android
        run: |
          set -o pipefail
          if ! ./gradlew :shiron-audio:testDebugUnitTest --console=plain --stacktrace 2>&1 | tee unit.log; then
            # One annotation (GitHub keeps 10 per step): the reason Gradle gives, joined.
            echo "::error::$(grep -E '^e: |error:|FAILED|What went wrong|Caused by|Test.*>' -A4 unit.log | grep -v '^\s*at ' | head -60 | tr '\n' '|' | cut -c1-6000)"
            exit 1
          fi
      - name: Enable KVM
        run: |
          ls -l /dev/kvm || echo "::warning::no /dev/kvm on this runner"
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Instrumented tests on an emulator (real MediaCodec)
        id: emulator
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-boot-timeout: 1200
          disable-animations: false
          script: bash scripts/ci-android-instrumented.sh
      - name: Report instrumented results
        if: always()
        run: |
          echo "::notice::emulator step: ${{ steps.emulator.outcome }}"
          [ -f connected.log ] && echo "::notice::$(grep -vE '^\s*$' connected.log | grep -vE '^> Task .*(UP-TO-DATE|NO-SOURCE|SKIPPED)|Deprecated Gradle|^\s*at ' | tail -60 | tr '\n' '|' | cut -c1-6000)"
          for f in $(find app -path '*androidTest-results*' -name 'TEST-*.xml' 2>/dev/null); do
            echo "::notice::$(basename "$f"): $(grep -oE 'tests="[0-9]+"' "$f" | head -1) $(grep -oE 'failures="[0-9]+"' "$f" | head -1)"
            grep -q '<failure' "$f" && echo "::error::$(grep -A12 '<failure' "$f" | grep -v '^\s*at ' | head -40 | tr '\n' '|' | cut -c1-6000)"
          done
          true

