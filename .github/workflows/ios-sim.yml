name: iPhone share check

# Builds the app for the iPhone simulator and drives it with Maestro (scripts/e2e/ios.sh), all
# flows of a variant in one Maestro session (scripts/e2e/suite.sh). Checks that must pass
# (e2e-*.yaml): the empty first launch; YouTube — full player, the small window, dragging, ✕,
# "חזרה" again and again; Settings; and with the App Group, files handed over in one share the
# way the extension does (mp3, voice note, WMA, MPG, a duplicate, a broken file, a text file) →
# convert, play, the player's controls, the end of a song in each repeat mode, renaming,
# pinning, deleting, lists, search, leaving during YouTube. Two jobs in parallel: with the App
# Group (AltStore / a paid account) and without any entitlements (Sideloadly with a free Apple
# ID: the link path and Settings only). The real share sheet, which the simulator taps
# unreliably, runs only when started by hand with "full". With the GEMINI_API_KEY secret it
# also sends Gemini a Hebrew recording (tests/gemini.live.test.ts). Screenshots go to the
# `screenshots` branch under ios-<dev branch>. WhatsApp itself can't run on a simulator.
on:
  push:
    branches: ["dev/**"]
    paths:
      - "app/**"
      - ".github/workflows/ios-sim.yml"
      - "scripts/e2e/**"
  workflow_dispatch:
    inputs:
      full:
        description: Also the real share sheet (unreliable on the simulator, ~20 min more)
        type: boolean
        default: false

concurrency:
  group: ios-sim-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  share:
    strategy:
      fail-fast: false
      matrix:
        variant: [group, nogroup]
    runs-on: macos-15
    timeout-minutes: 75
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Cache the FFmpeg build
        uses: actions/cache@v4
        with:
          path: build/ffmpeg
          key: ffmpeg-ios-${{ hashFiles('scripts/build-ffmpeg.sh', 'app/modules/shiron-audio/native/ffmpeg/*') }}
      - name: Build FFmpeg for what the phone can't read (LGPL)
        run: scripts/build-ffmpeg.sh ios
      - name: Generate iOS project
        working-directory: app
        env:
          CI: 1
        run: |
          npm ci
          npx expo prebuild --platform ios --clean

      - name: Gemini, live (only with the GEMINI_API_KEY secret)
        if: env.GEMINI_API_KEY != '' && matrix.variant == 'group'
        continue-on-error: true
        working-directory: app
        run: |
          say -v Carmit -o "$RUNNER_TEMP/speech.aiff" "שיר הגן. בוקר טוב ילדים, בוקר טוב לגן. השמש זורחת והציפורים שרות לנו שיר."
          afconvert -f m4af -d aac "$RUNNER_TEMP/speech.aiff" "$RUNNER_TEMP/speech.m4a"
          LIVE_AUDIO="$RUNNER_TEMP/speech.m4a" npx vitest run tests/gemini.live.test.ts 2>&1 | tee gemini.log
          grep -E 'gemini-|✓|×|FAIL|Error' gemini.log | head -20 | tr '\n' '|' | sed 's/^/::notice::gemini live: /'; echo

      - name: Build for the simulator (${{ matrix.variant }})
        working-directory: app/ios
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          set -o pipefail
          extra=()
          [ "$VARIANT" = nogroup ] && extra=(CODE_SIGN_ENTITLEMENTS= CODE_SIGNING_ALLOWED=NO)
          if ! xcodebuild -workspace app.xcworkspace -scheme app -configuration Release \
              -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
              -derivedDataPath "$RUNNER_TEMP/dd" ARCHS=arm64 ONLY_ACTIVE_ARCH=YES "${extra[@]}" build \
              2>&1 | tee -a build.log | grep -E '^\*\*|error:'; then
            grep -E 'error:' -A2 build.log | head -40 | while IFS= read -r line; do echo "::error::${line}"; done
            exit 1
          fi
          cp -R "$RUNNER_TEMP/dd/Build/Products/Release-iphonesimulator/app.app" "$RUNNER_TEMP/$VARIANT.app"
          echo "::notice::$VARIANT: $(codesign -d --entitlements - "$RUNNER_TEMP/$VARIANT.app/PlugIns/PlayGan.appex" 2>/dev/null | grep -o 'group\.[a-z.]*' | head -1 || true)"

      - name: Boot a simulator and install Maestro
        run: |
          UDID=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | test("^iPhone 1[5-7]"))][0].udid')
          echo "simulator $UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          bash scripts/e2e/install-maestro.sh
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          # FFmpeg for the ~40 s test songs (scripts/e2e/long-songs.sh); a short song is the fallback.
          command -v ffmpeg >/dev/null || brew install ffmpeg >/dev/null || true

      - name: Checks and share flows (${{ matrix.variant }})
        env:
          FULL: ${{ inputs.full && '1' || '0' }}
        run: bash scripts/e2e/ios.sh "$RUNNER_TEMP/${{ matrix.variant }}.app" ${{ matrix.variant }}

      - name: Report
        if: always()
        run: |
          for v in ${{ matrix.variant }}; do
            [ -f "sim-$v.log" ] || continue
            [ -f "shots/results-$v.txt" ] && tr '\n' '|' < "shots/results-$v.txt" | sed "s/^/::notice::$v results: /"; echo
            grep -h '\[PlayGan\]' "sim-$v.log" | head -20 | tr '\n' '|' | cut -c1-6000 | sed "s/^/::notice::$v extension: /"; echo
            grep -hiE 'crash|terminat|exception|fatal' "sim-$v.log" | head -20 | tr '\n' '|' | cut -c1-6000 | sed "s/^/::warning::$v problems: /"; echo
          done
          ls shots | tr '\n' ' ' | sed 's/^/::notice::shots: /'

      - name: Publish screenshots
        if: always() && hashFiles('shots/*.png') != ''
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          dir="ios-${BRANCH//\//-}-${{ matrix.variant }}"
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git fetch origin screenshots && git worktree add ../shots-branch origin/screenshots
          cd ../shots-branch
          rm -rf "$dir"; mkdir -p "$dir"
          cp "$GITHUB_WORKSPACE"/shots/*.png "$GITHUB_WORKSPACE"/shots/*.json "$GITHUB_WORKSPACE"/shots/*.txt "$dir/" 2>/dev/null || true; cp "$GITHUB_WORKSPACE"/sim-*.log "$dir/" 2>/dev/null || true
          git add -A "$dir" && git commit -qm "iPhone check (${{ matrix.variant }}) of $BRANCH at ${GITHUB_SHA::7}"
          for i in 1 2 3; do git pull -q --rebase origin screenshots && git push -q origin HEAD:screenshots && break; sleep 5; done
