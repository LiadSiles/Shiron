name: iPhone share check

# Builds the app for the iPhone simulator and drives the share sheet with Maestro: a YouTube
# link shared from Safari, a WhatsApp voice note (.opus) shared from Files through the share
# extension and through "Open in PlayGan". Twice: with the App Group (AltStore / a paid
# account) and without any entitlements, the way Sideloadly with a free Apple ID installs it.
# Screenshots go to the `screenshots` branch under ios-<dev branch>; the extension's log lines
# become annotations. WhatsApp itself can't run on a simulator.
on:
  push:
    branches: ["dev/**"]
    paths:
      - "app/**"
      - ".github/workflows/ios-sim.yml"
      - "scripts/ios-sim/**"
  workflow_dispatch:

concurrency:
  group: ios-sim-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  share:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Generate iOS project
        working-directory: app
        env:
          CI: 1
        run: |
          npm ci
          npx expo prebuild --platform ios --clean

      - name: Build for the simulator (with and without entitlements)
        working-directory: app/ios
        run: |
          set -o pipefail
          build() { # extra settings…
            if ! xcodebuild -workspace app.xcworkspace -scheme app -configuration Release \
                -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
                -derivedDataPath "$RUNNER_TEMP/dd" ARCHS=arm64 ONLY_ACTIVE_ARCH=YES "$@" build \
                2>&1 | tee -a build.log | grep -E '^\*\*|error:'; then
              grep -E 'error:' -A2 build.log | head -40 | while IFS= read -r line; do echo "::error::${line}"; done
              exit 1
            fi
          }
          OUT="$RUNNER_TEMP/dd/Build/Products/Release-iphonesimulator/app.app"
          build
          cp -R "$OUT" "$RUNNER_TEMP/group.app"
          build CODE_SIGN_ENTITLEMENTS= CODE_SIGNING_ALLOWED=NO
          cp -R "$OUT" "$RUNNER_TEMP/nogroup.app"
          for v in group nogroup; do
            echo "::notice::$v: $(codesign -d --entitlements - "$RUNNER_TEMP/$v.app/PlugIns/PlayGan.appex" 2>/dev/null | grep -o 'group\.[a-z.]*' | head -1 || true)"
          done

      - name: Boot a simulator and install Maestro
        run: |
          UDID=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | test("^iPhone 1[5-7]"))][0].udid')
          echo "simulator $UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Share flows — with App Group
        run: bash scripts/ios-sim/run.sh "$RUNNER_TEMP/group.app" group
      - name: Share flows — without entitlements (Sideloadly-like)
        run: bash scripts/ios-sim/run.sh "$RUNNER_TEMP/nogroup.app" nogroup

      - name: Report
        if: always()
        run: |
          for v in group nogroup; do
            [ -f "sim-$v.log" ] || continue
            grep -h '\[PlayGan\]' "sim-$v.log" | head -20 | tr '\n' '|' | cut -c1-6000 | sed "s/^/::notice::$v extension: /"; echo
            grep -hiE 'crash|terminat|exception|fatal' "sim-$v.log" | head -20 | tr '\n' '|' | cut -c1-6000 | sed "s/^/::warning::$v problems: /"; echo
          done
          ls shots | tr '\n' ' ' | sed 's/^/::notice::shots: /'

      - name: Publish screenshots
        if: always() && hashFiles('shots/*.png') != ''
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          dir="ios-${BRANCH//\//-}"
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git fetch origin screenshots && git worktree add ../shots-branch origin/screenshots
          cd ../shots-branch
          rm -rf "$dir"; mkdir -p "$dir"
          cp "$GITHUB_WORKSPACE"/shots/*.png "$GITHUB_WORKSPACE"/shots/*.json "$dir/" 2>/dev/null || true; cp "$GITHUB_WORKSPACE"/sim-*.log "$dir/" 2>/dev/null || true
          git add -A "$dir" && git commit -qm "iPhone share check of $BRANCH at ${GITHUB_SHA::7}"
          for i in 1 2 3; do git pull -q --rebase origin screenshots && git push -q origin HEAD:screenshots && break; sleep 5; done
