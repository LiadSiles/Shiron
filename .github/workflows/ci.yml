name: CI

# Fast checks on every push and pull request: typecheck + unit tests, and the config
# plugins (expo prebuild) with assertions on the generated native projects.
# The native audio module has its own workflow (native.yml).
on:
  push:
    branches: [main, "dev/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # Failures are re-emitted as annotations, readable through the checks API when raw
      # logs aren't (github-actions reporter for assertions, the log tail for setup errors).
      - name: Test
        run: |
          set -o pipefail
          if ! npx vitest run --reporter=default --reporter=github-actions 2>&1 | tee test.log; then
            grep -vE '^\s*$' test.log | tail -40 | while IFS= read -r line; do echo "::error::${line}"; done
            exit 1
          fi
      # Config plugins (share extension, signing, RTL, background audio) only run at prebuild:
      # this catches a broken plugin without a full native build.
      - name: Prebuild native projects
        run: npx expo prebuild --no-install --clean
        env:
          CI: 1
      - name: Check generated native config
        run: |
          fail() { echo "::error::$1"; exit 1; }
          grep -q '<string>audio</string>' ios/*/Info.plist || fail "UIBackgroundModes audio missing"
          grep -q 'NSExtensionActivationSupportsFileWithMaxCount' ios/PlayGan/ShareExtension-Info.plist || fail "share extension missing"
          grep -q 'NSExtensionActivationSupportsMovieWithMaxCount' ios/PlayGan/ShareExtension-Info.plist || fail "share extension does not accept videos"
          grep -A1 CFBundleDisplayName ios/app/Info.plist | grep -q PlayGan || fail "iOS home-screen name is not PlayGan"
          grep -A1 CFBundleDisplayName ios/PlayGan/ShareExtension-Info.plist | grep -q PlayGan || fail "share-sheet name is not PlayGan"
          grep -q 'resolvedAppGroup' ios/PlayGan/ShareViewController.swift || fail "share extension is the library template, not ours (patches/expo-share-intent)"
          grep -q 'mediaPlayback' android/app/src/main/AndroidManifest.xml || fail "media playback service missing"
          grep -q 'audio/\*' android/app/src/main/AndroidManifest.xml || fail "audio share intent missing"
          grep -q 'video/\*' android/app/src/main/AndroidManifest.xml || fail "video share intent missing"
          grep -q 'signingConfigs.shiron' android/app/build.gradle || fail "project signing not applied"
          grep -q 'WorkDatabase_Impl' android/app/proguard-rules.pro || fail "R8 keep rules missing (release crashes at launch)"
          grep -q 'name="app_name"[^>]*>PlayGan<' android/app/src/main/res/values/strings.xml || fail "Android launcher name is not PlayGan"
          npx expo-modules-autolinking resolve --platform android --json | grep -q '"app.shiron.audio.ShironAudioModule"' || fail "audio module not autolinked (android)"
          npx expo-modules-autolinking resolve --platform apple --json | grep -q '"ShironAudioModule"' || fail "audio module not autolinked (iOS)"
