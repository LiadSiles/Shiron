name: CI

# Fast checks on every push and pull request: typecheck + unit tests for the app and the
# server, the config plugins (expo prebuild), and the server's Docker image.
on:
  push:
    branches: [main, "dev/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npx vitest run --reporter=default --reporter=github-actions
      # Config plugins (share extension, signing, RTL, background audio) only run at prebuild:
      # this catches a broken plugin without a full native build.
      - name: Prebuild native projects
        run: npx expo prebuild --no-install --clean
        env:
          CI: 1
      - name: Check generated native config
        run: |
          grep -q '<string>audio</string>' ios/*/Info.plist || { echo "::error::UIBackgroundModes audio missing"; exit 1; }
          grep -q 'NSExtensionActivationSupportsFileWithMaxCount' ios/Shiron/ShareExtension-Info.plist || { echo "::error::share extension missing"; exit 1; }
          grep -q 'mediaPlayback' android/app/src/main/AndroidManifest.xml || { echo "::error::media playback service missing"; exit 1; }
          grep -q 'audio/\*' android/app/src/main/AndroidManifest.xml || { echo "::error::audio share intent missing"; exit 1; }
          grep -q 'signingConfigs.shiron' android/app/build.gradle || { echo "::error::project signing not applied"; exit 1; }

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          echo "::notice::$(ffmpeg -version | head -1)"
      - run: npm ci
      - run: npm run typecheck
      # The github-actions reporter turns failures into annotations, readable through the
      # checks API when raw logs aren't.
      - run: npx vitest run --reporter=default --reporter=github-actions

  server-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build server image
        run: docker build -f server/Dockerfile -t shiron-server .
      - name: Smoke-test the image
        run: |
          docker run -d --name shiron -p 8787:8787 -e APP_TOKEN=ci shiron-server
          for i in $(seq 1 30); do curl -sf localhost:8787/health && break; sleep 1; done
          curl -sf -H 'Authorization: Bearer ci' localhost:8787/v1/health
          docker logs shiron
