# The home screen's "+" (always there, also after the first song): picks a file from Files.
# FILE is the name to pick; the result (toast, or the WMA explanation) is photographed.
appId: app.shiron.gan
---
- launchApp
- waitForAnimationToEnd
- tapOn:
    text: הוספת שירים מהקבצים
- waitForAnimationToEnd
- takeScreenshot: ${VARIANT}-picker
- tapOn:
    text: Browse
    optional: true
- tapOn:
    text: On My iPhone
    optional: true
- waitForAnimationToEnd
- tapOn:
    text: ${FILE}.*
- tapOn:
    text: Open
    optional: true
- waitForAnimationToEnd:
    timeout: 6000
- takeScreenshot: ${VARIANT}-result
- tapOn:
    text: OK
    optional: true
