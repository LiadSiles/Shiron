# The home screen's "+" (always there, also after the first song): picks a file from Files.
# FILE is the name to pick (an mp3, and a real WMA for our decoder); the result is photographed.
appId: app.shiron.gan
---
- runFlow: dismiss.yaml
- launchApp
- waitForAnimationToEnd
- tapOn:
    text: הוספת שירים מהקבצים
- waitForAnimationToEnd
- takeScreenshot: ${VARIANT}-picker
- tapOn:
    text: Browse
    optional: true
- tapOn:
    text: On My iPhone
    optional: true
- waitForAnimationToEnd
- tapOn:
    text: ${FILE}.*
- runFlow: dismiss.yaml
- waitForAnimationToEnd:
    timeout: 6000
- takeScreenshot: ${VARIANT}-result
- tapOn:
    text: OK
    optional: true
