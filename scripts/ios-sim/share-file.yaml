# Shares a WhatsApp voice note (.opus) from the Files app through PlayGan in the share sheet.
appId: com.apple.DocumentsApp
---
- tapOn:  # a question left open by the previous flow
    text: Open
    optional: true
- launchApp
- waitForAnimationToEnd
- tapOn:
    text: Continue
    optional: true
- tapOn:
    text: Browse
    optional: true
- tapOn:
    text: Browse
    optional: true
- tapOn:
    text: On My iPhone
    optional: true
- waitForAnimationToEnd
- takeScreenshot: ${VARIANT}-5-files
- longPressOn:
    text: voice-whatsapp.*
- waitForAnimationToEnd
- tapOn:
    text: Share
- waitForAnimationToEnd
- takeScreenshot: ${VARIANT}-6-file-share-sheet
# The share sheet's PlayGan icon, by position: the sheet is another process whose elements
# Maestro sometimes can't see, and "PlayGan" also labels the status bar's back link.
- waitForAnimationToEnd
- tapOn:
    point: "9%,51%"
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: ${VARIANT}-7-after-file
- tapOn:
    text: Open
    optional: true
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: ${VARIANT}-7b-app
