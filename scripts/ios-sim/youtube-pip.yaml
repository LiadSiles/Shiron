# YouTube keeps playing in a small window while she browses: open the YouTube song (added by
# the shiron://share link just before), leave the full player, go to the library.
appId: app.shiron.gan
---
- runFlow: dismiss.yaml
- launchApp
- waitForAnimationToEnd
- tapOn:
    text: ".*שיר מיוטיוב.*"
- extendedWaitUntil:
    visible: "Me at the zoo.*|.*YouTube.*"
    timeout: 10000
    optional: true
- takeScreenshot: ${VARIANT}-4b-youtube-player
# Maestro's back is Android-only; the header's back button says "חזרה".
- tapOn:
    text: "חזרה"
- waitForAnimationToEnd
- takeScreenshot: ${VARIANT}-4c-youtube-pip
- tapOn:
    text: ספרייה
    optional: true
- waitForAnimationToEnd
- takeScreenshot: ${VARIANT}-4d-youtube-pip-library
# Back to the full player from the small window, then details on top of it: the video must
# follow (slot, then small window) and never cover the header.
- tapOn:
    text: "פתיחת הנגן המלא"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: ${VARIANT}-4e-youtube-back-to-player
- tapOn:
    text: "פרטים"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: ${VARIANT}-4f-youtube-details-over-player
# Back out of details and the player, then in and out of the player twice more through the
# mini player: "חזרה" must work every time (owner: it stopped working on the second visit).
- tapOn:
    text: "חזרה"
    optional: true
- waitForAnimationToEnd
- tapOn:
    text: "חזרה"
    optional: true
- waitForAnimationToEnd
- tapOn:
    text: "מתנגן: .*"
    optional: true
- waitForAnimationToEnd
- tapOn:
    text: "חזרה"
    optional: true
- waitForAnimationToEnd
- tapOn:
    text: "מתנגן: .*"
    optional: true
- waitForAnimationToEnd
- tapOn:
    text: "חזרה"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: ${VARIANT}-4g-youtube-third-back
# Drag the small window by its bar to the top of the screen.
- swipe:
    start: "27%, 79%"
    end: "70%, 25%"
    duration: 800
- waitForAnimationToEnd
- takeScreenshot: ${VARIANT}-4h-youtube-pip-dragged
