# Shares a YouTube page from Safari through PlayGan's share extension — the path a YouTube or
# WhatsApp link takes. Uncertain taps are optional; screenshots tell what happened.
appId: com.apple.mobilesafari
---
- openLink:
    link: https://www.youtube.com/watch?v=jNQXAC9IVRw
    browser: true
- waitForAnimationToEnd:
    timeout: 10000
- takeScreenshot: ${VARIANT}-2-safari
- runFlow:
    when:
      visible:
        id: ShareButton
    commands:
      - tapOn:
          id: ShareButton
- runFlow:
    when:
      notVisible: Add to Reading List
    commands:
      - tapOn:
          text: Share
          optional: true
- waitForAnimationToEnd
- takeScreenshot: ${VARIANT}-3-share-sheet
# The share sheet's PlayGan icon, by position: the sheet is another process whose elements
# Maestro sometimes can't see, and "PlayGan" also labels the status bar's back link.
- waitForAnimationToEnd
- tapOn:
    point: "47%,56%"
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: ${VARIANT}-4-after-link
# iOS may ask before the extension opens the app.
- tapOn:
    text: Open
    optional: true
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: ${VARIANT}-4b-app
