# Shares a YouTube page from Safari through PlayGan's share extension — the path a YouTube or
# WhatsApp link takes. Uncertain taps are optional; screenshots tell what happened.
appId: com.apple.mobilesafari
---
- runFlow: dismiss.yaml
- openLink:
    link: https://www.youtube.com/watch?v=jNQXAC9IVRw
    browser: true
- waitForAnimationToEnd:
    timeout: 10000
- takeScreenshot: ${VARIANT}-2-safari
- runFlow:
    when:
      visible:
        id: ShareButton
    commands:
      - tapOn:
          id: ShareButton
- runFlow:
    when:
      notVisible: Add to Reading List
    commands:
      - tapOn:
          text: Share
          optional: true
- waitForAnimationToEnd
- takeScreenshot: ${VARIANT}-3-share-sheet
# The share sheet's PlayGan icon (index 1: the status bar's back link is also "PlayGan").
# The sheet is another process that Maestro sometimes can't see at first: retry.
- retry:
    maxRetries: 3
    commands:
      - waitForAnimationToEnd
      - tapOn:
          text: PlayGan
          index: 1
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: ${VARIANT}-4-after-link
- runFlow: dismiss.yaml
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: ${VARIANT}-4b-app
# Leave the full player: YouTube carries on in the small window while she browses.
- waitForAnimationToEnd:
    timeout: 8000
- back
- waitForAnimationToEnd
- takeScreenshot: ${VARIANT}-4c-youtube-pip
- tapOn:
    text: ספרייה
    optional: true
- waitForAnimationToEnd
- takeScreenshot: ${VARIANT}-4d-youtube-pip-library
