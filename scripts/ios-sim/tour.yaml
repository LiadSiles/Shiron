# A walk through the main screens after songs arrived: play a song (mini player), the full
# player, the library, search, settings (the "שיתוף מוואטסאפ" row says what this install can do).
appId: app.shiron.gan
---
- launchApp
- waitForAnimationToEnd
- takeScreenshot: ${VARIANT}-home
- tapOn:
    text: boker-tov
    optional: true
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: ${VARIANT}-playing
- tapOn:
    text: "מתנגן:.*"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: ${VARIANT}-player
- back
- tapOn:
    text: ספרייה
    optional: true
- waitForAnimationToEnd
- takeScreenshot: ${VARIANT}-library
- tapOn:
    text: "חיפוש.*"
    optional: true
- inputText: boker
- waitForAnimationToEnd
- takeScreenshot: ${VARIANT}-search
- back
- tapOn:
    text: הגדרות
    optional: true
- waitForAnimationToEnd
- takeScreenshot: ${VARIANT}-settings
