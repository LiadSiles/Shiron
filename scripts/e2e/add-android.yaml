# Android: a file from Downloads through the home screen's "+" (the system file picker).
# FILE is the file name; the files were pushed to /sdcard/Download by android.sh.
appId: app.shiron.gan
---
- runFlow: dismiss.yaml
- launchApp
- tapOn: "הוספת שירים מהקבצים"
- waitForAnimationToEnd
# The picker opens on "Recent", which doesn't list every file: go to Downloads. The drawer is
# still sliding in when "Downloads" is tapped, and the tap can miss (the picker stayed on
# Recent): wait for the file, and try once more.
- retry:
    maxRetries: 1
    commands:
      - runFlow:
          when:
            notVisible: "${FILE}"
          commands:
            - tapOn: "Show roots"
            - waitForAnimationToEnd
            - tapOn: "Downloads"
            - waitForAnimationToEnd
      - extendedWaitUntil:
          visible: "${FILE}"
          timeout: 8000
- tapOn: "${FILE}"
# With several files allowed, a tap may only select: then confirm.
- tapOn:
    text: "(Select|SELECT|Open|OPEN|Done|DONE)"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: ${VARIANT}-added
