# Whatever stands between a flow and the app. iOS asks "Open in “PlayGan”?" whenever something outside the app opens it by its link (the
# share extension without an App Group, simctl openurl). Answer it, if it is there.
appId: app.shiron.gan
---
# A slow CI emulator sometimes shows "Pixel Launcher isn't responding" over everything: wait it out.
- repeat:
    while:
      visible: ".*isn.t responding.*"
    times: 3
    commands:
      - tapOn: "Wait"
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible: Open
    timeout: 4000
    optional: true
- tapOn:
    text: Open
    optional: true
- waitForAnimationToEnd
# After the first song, the app offers to connect an AI service once (a modal): close it.
- runFlow:
    when:
      visible: "חיבור שירות AI"
      platform: iOS
    commands:
      - swipe:
          start: "50%, 12%"
          end: "50%, 92%"
          duration: 400
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "חיבור שירות AI"
      platform: Android
    commands:
      - back
# Search left open by an earlier flow (the app keeps its state between launches on Android).
- runFlow:
    when:
      visible: "מה מחפשים\\?|לא נמצא שיר"
    commands:
      - tapOn: "ביטול"
