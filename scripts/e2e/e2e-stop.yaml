# Stop at the end of the song (owner, 0.17.0) inside a list: when the song ends nothing else
# plays — not the next song, not the same one again, not the list from its start. The song waits
# at its start, and play starts it again. The phone stops it itself (our expo-audio patch), so
# it holds in the background too.
appId: app.shiron.gan
---
- runFlow: dismiss.yaml
- launchApp
- tapOn: ספרייה
- tapOn: "כל השירים.*"
# (Earlier flows rename boker-tov and delete voice-whatsapp; gan-party keeps its name.)
- tapOn: "נגני gan-party.*"
- tapOn: "מתנגן: gan-party.*"
- assertVisible: "מתנגן עכשיו"
# Repeat starts "off" after a launch: three taps to the fourth mode, one by one (a while-loop
# with one pattern for every name stopped at "חזרה על הכול" on Android).
- tapOn: "בלי חזרה"
- assertVisible: "חזרה על הכול"
- tapOn: "חזרה על הכול"
- assertVisible: "חזרה על השיר"
- tapOn: "חזרה על השיר"
- assertVisible: "עצירה בסוף השיר"
- assertVisible: "הניגון ייעצר בסוף השיר"
- swipe:
    from: "מיקום בשיר.*"
    direction: RIGHT
- extendedWaitUntil:
    visible: "ניגון"
    timeout: 10000
- runFlow: wait-4s.yaml
# Still this song, stopped; had it gone on, the next song would be playing ("השהיה"), or the
# list would say it ended.
- assertVisible: "ניגון"
- assertVisible: "gan-party"
- assertNotVisible: "הרשימה הסתיימה"
- takeScreenshot: ${VARIANT}-stop
- tapOn: "ניגון"
- extendedWaitUntil:
    visible: "השהיה"
    timeout: 5000
- assertVisible: "gan-party"
- tapOn: "השהיה"
- runFlow: back.yaml
