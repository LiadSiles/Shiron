# A song's screen: rename (kept after the app restarts), pin, delete.
appId: app.shiron.gan
---
- runFlow: dismiss.yaml
- launchApp
- tapOn: ספרייה
- tapOn: "כל השירים.*"
- longPressOn: "נגני boker-tov"
- assertVisible: "פרטי שיר"
# The simulator's keyboard sometimes types Hebrew out of order ("בוקר וב לגןט") or leaves the
# old name in front: check the field holds exactly the new name, else type it again.
- retry:
    maxRetries: 2
    commands:
      - tapOn: "שם השיר"
      - runFlow:
          when:
            platform: iOS
          commands:
            - tapOn: "Clear text"
      - runFlow:
          when:
            platform: Android
          commands:
            - eraseText: 40
      - inputText: "בוקר טוב לגן"
      - assertVisible: "בוקר טוב לגן"
- pressKey: Enter
- tapOn: "הצמדה"
- assertVisible: "מוצמד"
- takeScreenshot: ${VARIANT}-song-edited
- stopApp
- launchApp
- tapOn: ספרייה
- tapOn: "כל השירים.*"
- assertVisible: ".*בוקר טוב לגן.*"
- assertNotVisible: ".*boker-tov.*"
- longPressOn: "נגני voice-whatsapp"
- scrollUntilVisible:
    element:
      text: "מחיקת השיר"
- tapOn: "מחיקת השיר"
- tapOn: "מחיקה"
- waitForAnimationToEnd
- assertNotVisible: ".*voice-whatsapp.*"
- takeScreenshot: ${VARIANT}-song-deleted
