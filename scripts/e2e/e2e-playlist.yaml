# Her own list: create with two songs, reorder, play it, delete it.
appId: app.shiron.gan
---
- runFlow: dismiss.yaml
- launchApp
- tapOn: ספרייה
- tapOn: "רשימה חדשה"
- tapOn: "old-song"
- tapOn: "gan-party"
- tapOn: "שם הרשימה"
- inputText: "מעגל בוקר"
- pressKey: Enter
- assertVisible: ".*מעגל בוקר.*"
- tapOn: "יצירת הרשימה"
- waitForAnimationToEnd
- assertVisible: ".*מעגל בוקר.*"
- assertVisible: ".*old-song.*"
- assertVisible: ".*gan-party.*"
- tapOn: "סידור"
- tapOn: "להזיז את gan-party למעלה"
- tapOn: "סיום"
- takeScreenshot: ${VARIANT}-playlist
- tapOn: "נגני הכול"
- extendedWaitUntil:
    visible: "מתנגן: gan-party.*"
    timeout: 10000
- scrollUntilVisible:
    element:
      text: "מחיקת הרשימה"
- tapOn: "מחיקת הרשימה"
- tapOn: "מחיקה"
- waitForAnimationToEnd
- assertNotVisible: "רשימה מעגל בוקר.*"
