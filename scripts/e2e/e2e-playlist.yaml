# Her own list: create with two songs, reorder, play it, delete it.
appId: app.shiron.gan
---
- runFlow: dismiss.yaml
- launchApp
- tapOn: ספרייה
- tapOn: "רשימה חדשה"
- tapOn: "old-song"
- tapOn: "gan-party"
# The iPhone simulator sometimes types Hebrew out of order ("מעגל וקרב"): check the field
# itself (the placeholder also mentions this name, so the match is exact) and type again.
- retry:
    maxRetries: 2
    commands:
      - tapOn: "שם הרשימה"
      - eraseText: 40
      - inputText: "מעגל בוקר"
      - assertVisible: "מעגל בוקר"
- pressKey: Enter
- tapOn: "יצירת הרשימה"
- waitForAnimationToEnd
- assertVisible: ".*מעגל בוקר.*"
- assertVisible: ".*old-song.*"
- assertVisible: ".*gan-party.*"
- tapOn: "סידור הרשימה"
- tapOn: "להזיז את gan-party למעלה"
- tapOn: "סיום הסידור"
- takeScreenshot: ${VARIANT}-playlist
- tapOn: "נגני הכול"
- extendedWaitUntil:
    visible: "מתנגן: gan-party.*"
    timeout: 10000
- scrollUntilVisible:
    element:
      text: "מחיקת הרשימה"
- tapOn: "מחיקת הרשימה"
- tapOn: "מחיקה"
- waitForAnimationToEnd
- assertNotVisible: "רשימה מעגל בוקר.*"
