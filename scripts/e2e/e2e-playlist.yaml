# Her own list: create with two songs, reorder, play it, delete it.
appId: app.shiron.gan
---
- runFlow: dismiss.yaml
- launchApp
- tapOn: ספרייה
- tapOn: "רשימה חדשה"
- tapOn: "old-song"
- tapOn: "gan-party"
# A Latin name: the iPhone simulator types Hebrew out of order ("מעגל וקרב") often enough to fail
# this flow even with retries — a simulator keyboard issue, not the app's (a phone types fine).
- tapOn: "שם הרשימה"
- inputText: "Morning circle"
- pressKey: Enter
- tapOn: "יצירת הרשימה"
- waitForAnimationToEnd
- assertVisible: ".*Morning circle.*"
- assertVisible: ".*old-song.*"
- assertVisible: ".*gan-party.*"
- tapOn: "סידור הרשימה"
- tapOn: "להזיז את gan-party למעלה"
- tapOn: "סיום הסידור"
- takeScreenshot: ${VARIANT}-playlist
- tapOn: "נגני הכול"
- extendedWaitUntil:
    visible: "מתנגן: gan-party.*"
    timeout: 10000
- scrollUntilVisible:
    element:
      text: "מחיקת הרשימה"
- tapOn: "מחיקת הרשימה"
- tapOn: "מחיקה"
- waitForAnimationToEnd
- assertNotVisible: "רשימה Morning circle.*"
