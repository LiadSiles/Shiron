# Her own list: create with two songs, reorder, play it, delete it.
appId: app.shiron.gan
---
- runFlow: dismiss.yaml
- launchApp
- tapOn: ספרייה
- tapOn: "רשימה חדשה"
- tapOn: "old-song"
- tapOn: "gan-party"
# Typed letters came out reordered on the iPhone ("מעגל וקרב", then "Morng circlein"): the
# field was controlled and re-rendered the song list on every letter. It is uncontrolled now
# (0.16.1); this checks the name arrives exactly as typed.
- tapOn: "שם הרשימה"
- inputText: "Morning circle"
- pressKey: Enter
- tapOn: "יצירת הרשימה"
- waitForAnimationToEnd
- assertVisible: ".*Morning circle.*"
- assertVisible: ".*old-song.*"
- assertVisible: ".*gan-party.*"
- tapOn: "סידור הרשימה"
- tapOn: "להזיז את gan-party למעלה"
- tapOn: "סיום הסידור"
- takeScreenshot: ${VARIANT}-playlist
- tapOn: "נגני הכול"
- extendedWaitUntil:
    visible: "מתנגן: gan-party.*"
    timeout: 10000
- scrollUntilVisible:
    element:
      text: "מחיקת הרשימה"
- tapOn: "מחיקת הרשימה"
- tapOn: "מחיקה"
- waitForAnimationToEnd
- assertNotVisible: "רשימה Morning circle.*"
