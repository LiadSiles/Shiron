# YouTube: the full player, the small window while she browses (⤢ back, drag, ✕), and
# "חזרה" again and again. The song came from a shiron://share link.
appId: app.shiron.gan
---
- runFlow: dismiss.yaml
- launchApp
# The shared link can take a few more seconds to land on a slow CI simulator (the song was in
# the library at the end of a run where this step had given up after 17 s).
- extendedWaitUntil:
    visible: "נגני .*(שיר מיוטיוב|Rick Astley|Never Gonna).*"
    timeout: 30000
- tapOn: "נגני .*(שיר מיוטיוב|Rick Astley|Never Gonna).*"
- assertVisible: "מתנגן עכשיו"
- takeScreenshot: ${VARIANT}-yt-player
# The first "חזרה" right after the player opened was once ignored on a CI simulator (the video
# keeps the screen from settling, so the tap can land mid-transition): one more try, with a
# screenshot so a repeat is noticed. The three rounds below must then pass outright.
- retry:
    maxRetries: 1
    commands:
      - runFlow: back.yaml
      - extendedWaitUntil:
          visible: "סגירת הסרטון"
          timeout: 5000
      - takeScreenshot: ${VARIANT}-yt-after-back
- assertNotVisible: "מתנגן עכשיו"
- takeScreenshot: ${VARIANT}-yt-pip-home
- repeat:
    times: 3
    commands:
      - tapOn: "פתיחת הנגן המלא"
      - assertVisible: "מתנגן עכשיו"
      - assertNotVisible: "סגירת הסרטון"
      - runFlow: back.yaml
      - assertVisible: "סגירת הסרטון"
- tapOn: ספרייה
- assertVisible: "סגירת הסרטון"
- swipe:
    from:
      text: "הזזת החלון"
    direction: UP
- waitForAnimationToEnd
- assertVisible: "סגירת הסרטון"
- takeScreenshot: ${VARIANT}-yt-pip-dragged
- tapOn: "סגירת הסרטון"
- assertNotVisible: "פתיחת הנגן המלא"
- takeScreenshot: ${VARIANT}-yt-closed
