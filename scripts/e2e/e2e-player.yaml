# The full player: play all, next / previous, the three repeat modes, pause — and "חזרה" works
# every time, also after coming back to the player again and again (owner, 0.11.0).
appId: app.shiron.gan
---
- runFlow: dismiss.yaml
- launchApp
- tapOn: ספרייה
- tapOn: "כל השירים.*"
- tapOn: "נגני הכול"
# A YouTube song at the top opens the full player by itself; an audio song plays in the mini player.
- runFlow:
    when:
      notVisible: "מתנגן עכשיו"
    commands:
      - tapOn: "מתנגן: .*"
- assertVisible: "מתנגן עכשיו"
- tapOn: "השיר הבא"
- tapOn: "שיר קודם / לתחילת השיר"
- tapOn: "בלי חזרה"
- assertVisible: "חזרה על הכול"
- tapOn: "חזרה על הכול"
- assertVisible: "חזרה על השיר"
- tapOn: "חזרה על השיר"
- assertVisible: "בלי חזרה"
- takeScreenshot: ${VARIANT}-player
- runFlow: back.yaml
- assertNotVisible: "מתנגן עכשיו"
- repeat:
    times: 3
    commands:
      - tapOn: "מתנגן: .*"
      - assertVisible: "מתנגן עכשיו"
      - tapOn: "פרטים"
      - assertVisible: "פרטי שיר"
      - runFlow: back.yaml
      - assertVisible: "מתנגן עכשיו"
      - runFlow: back.yaml
      - assertNotVisible: "מתנגן עכשיו"
- takeScreenshot: ${VARIANT}-after-backs
# "נגני הבא" from a song's long-press menu (0.16.0, always offered since 0.16.3): it goes right
# after the song playing, and the full player shows it as next, "בתור". Pick a song that isn't
# the one playing (that one has no "נגני הבא"). Paused first: the test songs are short, and the
# song playing ended before the check, so the queued song was already playing (CI, 0.16.3).
- tapOn: "מתנגן: .*"
- runFlow:
    when:
      visible: "השהיה"
    commands:
      - tapOn: "השהיה"
- runFlow: back.yaml
- longPressOn: "(נגני|השהיית) voice-whatsapp.*"
- runFlow:
    when:
      notVisible: "נגני הבא"
    commands:
      - tapOn: "ביטול"
      - longPressOn: "(נגני|השהיית) boker-tov.*"
- tapOn: "נגני הבא"
- assertVisible: "יתנגן אחרי השיר הזה"
- tapOn: "מתנגן: .*"
- assertVisible: ".*בתור.*"
- takeScreenshot: ${VARIANT}-up-next
- runFlow: back.yaml
- tapOn: "מתנגן: .*"
# The test songs are short: pause if it is still playing; either way it shows "ניגון" then.
- runFlow:
    when:
      visible: "השהיה"
    commands:
      - tapOn: "השהיה"
- assertVisible: "ניגון"
- runFlow: back.yaml
