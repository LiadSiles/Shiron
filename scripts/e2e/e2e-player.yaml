# The full player: play all, next / previous, the three repeat modes, pause — and "חזרה" works
# every time, also after coming back to the player again and again (owner, 0.11.0).
appId: app.shiron.gan
---
- runFlow: dismiss.yaml
- launchApp
- tapOn: ספרייה
- tapOn: "כל השירים.*"
- tapOn: "נגני הכול"
# A YouTube song at the top opens the full player by itself; an audio song plays in the mini player.
- runFlow:
    when:
      notVisible: "מתנגן עכשיו"
    commands:
      - tapOn: "מתנגן: .*"
- assertVisible: "מתנגן עכשיו"
- tapOn: "השיר הבא"
- tapOn: "שיר קודם / לתחילת השיר"
- tapOn: "בלי חזרה"
- assertVisible: "חזרה על הכול"
- tapOn: "חזרה על הכול"
- assertVisible: "חזרה על השיר"
- tapOn: "חזרה על השיר"
- assertVisible: "בלי חזרה"
- takeScreenshot: ${VARIANT}-player
- runFlow: back.yaml
- assertNotVisible: "מתנגן עכשיו"
- repeat:
    times: 3
    commands:
      - tapOn: "מתנגן: .*"
      - assertVisible: "מתנגן עכשיו"
      - tapOn: "פרטים"
      - assertVisible: "פרטי שיר"
      - runFlow: back.yaml
      - assertVisible: "מתנגן עכשיו"
      - runFlow: back.yaml
      - assertNotVisible: "מתנגן עכשיו"
- takeScreenshot: ${VARIANT}-after-backs
- tapOn: "מתנגן: .*"
# The test songs are short: pause if it is still playing; either way it shows "ניגון" then.
- runFlow:
    when:
      visible: "השהיה"
    commands:
      - tapOn: "השהיה"
- assertVisible: "ניגון"
- runFlow: back.yaml
