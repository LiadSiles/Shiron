- assertVisible: ".*old-song.*"
- tapOn: "ניקוי החיפוש"
- inputText: "בוקר טוב"
- assertVisible: ".*בוקר טוב לגן.*"
- tapOn: "ניקוי החיפוש"
- inputText: "zzzz"
- assertVisible: "לא נמצא שיר"
- takeScreenshot: ${VARIANT}-search-none
- tapOn: "ביטול"
