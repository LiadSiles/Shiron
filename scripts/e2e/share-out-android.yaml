# Android: a song's "שיתוף", twice in a row, opens the system share sheet with the song's file;
# then a YouTube song's link, and a whole category.
appId: app.shiron.gan
---
- runFlow: dismiss.yaml
- launchApp
- tapOn: ספרייה
- tapOn: "כל השירים.*"
- longPressOn: "נגני בוקר טוב לגן"
- tapOn: "שיתוף"
- waitForAnimationToEnd
- takeScreenshot: ${VARIANT}-share-sheet
- assertNotVisible: ".*לא הצלחנו לשתף.*"
- assertVisible: ".*(Share|Nearby|Bluetooth|Copy|Messages|Gmail|Drive).*"
- back
# Again right away: with expo-sharing every share after the first failed while it still
# waited for the first one's result (the WhatsApp report, 0.12.1).
- assertVisible: "פרטי שיר"
- tapOn: "שיתוף"
- waitForAnimationToEnd
- assertNotVisible: ".*לא הצלחנו לשתף.*"
- assertVisible: ".*(Share|Nearby|Bluetooth|Copy|Messages|Gmail|Drive).*"
- takeScreenshot: ${VARIANT}-share-again
- back
# Back from the song's page to the list.
- runFlow: back.yaml
- longPressOn: "נגני .*(שיר מיוטיוב|Rick Astley|Never Gonna).*"
- tapOn: "שיתוף"
- waitForAnimationToEnd
- takeScreenshot: ${VARIANT}-share-link
- assertNotVisible: ".*לא הצלחנו לשתף.*"
- back
# A whole category: all its songs as files and the YouTube song as a link, in one sheet.
- runFlow: back.yaml
- tapOn: "שיתוף כל השירים"
- waitForAnimationToEnd
- assertNotVisible: ".*לא הצלחנו לשתף.*"
- assertVisible: ".*(Share|Nearby|Bluetooth|Copy|Messages|Gmail|Drive).*"
- takeScreenshot: ${VARIANT}-share-category
- back
